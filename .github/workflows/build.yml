name: Build Helium macOS DMG (PR #915 - hover-expand-fast-hover)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - x86_64

jobs:
  build:
    name: Build Helium (${{ github.event.inputs.arch }})
    # GitHub's latest macOS runner (Apple Silicon for arm64, x86_64 for Intel)
    runs-on: ${{ github.event.inputs.arch == 'arm64' && 'macos-latest' || 'macos-13' }}
    timeout-minutes: 600

    steps:
      # ── 1. Check out helium-macos (the macOS packaging repo) ──────────────
      - name: Check out helium-macos
        uses: actions/checkout@v4
        with:
          repository: imputnet/helium-macos
          ref: main
          path: helium-macos
          # Do NOT recurse submodules here — we override the submodule below

      # ── 2. Check out the PR branch of cyfung1031/helium into the submodule
      #       path so it is used instead of the pinned upstream commit ────────
      - name: Check out PR branch (cyfung1031/helium @ pr-915-hover-expand-fast-hover)
        uses: actions/checkout@v4
        with:
          repository: cyfung1031/helium
          ref: pr-915-hover-expand-fast-hover
          path: helium-macos/helium-chromium

      # ── 3. Install build dependencies via Homebrew ────────────────────────
      - name: Install Homebrew dependencies
        run: |
          brew install python@3 llvm ninja coreutils readline xz zlib node
          brew unlink binutils || true

      - name: Install Python dependencies
        run: |
          pip3 install httplib2 --break-system-packages

      # ── 4. Set up LLVM environment variables (required by build.sh) ───────
      - name: Set LLVM environment variables
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "LDFLAGS=-L${LLVM_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I${LLVM_PREFIX}/include" >> "$GITHUB_ENV"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"

      # ── 5. Install appdmg for better DMG creation ─────────────────────────
      - name: Install appdmg
        run: npm install -g appdmg

      # ── 6. Cache the Chromium download cache to speed up re-runs ──────────
      - name: Cache Chromium download cache
        uses: actions/cache@v4
        with:
          path: helium-macos/build/download_cache
          key: chromium-download-cache-${{ github.event.inputs.arch }}-${{ hashFiles('helium-macos/helium-chromium/chromium_version.txt', 'helium-macos/helium-chromium/downloads.ini', 'helium-macos/downloads.ini', 'helium-macos/helium-chromium/deps.ini') }}
          restore-keys: |
            chromium-download-cache-${{ github.event.inputs.arch }}-

      # ── 7. Open Xcode (required by build tooling) ─────────────────────────
      - name: Open Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      # ── 8. Run the build ──────────────────────────────────────────────────
      #
      #   build.sh flow (from source):
      #     retrieve_and_unpack_resource.sh -g $arch   → clone / download Chromium source
      #     retrieve_and_unpack_resource.sh -t         → download clang + rust toolchain
      #     prune_binaries.py
      #     patches.py apply
      #     domain_substitution.py apply
      #     name_substitution.py
      #     helium_version.py
      #     generate_resources.py / replace_resources.py
      #     gn gen + ninja chrome chromedriver
      #     sign_and_package_app.sh  → produces .dmg (unsigned, no MACOS_CERTIFICATE_NAME)
      #
      - name: Build Helium
        working-directory: helium-macos
        run: ./build.sh ${{ github.event.inputs.arch }}
        env:
          # No signing — omitting MACOS_CERTIFICATE_NAME causes the script to
          # fall back to `codesign --force --deep --sign -` (ad-hoc signing),
          # which is perfectly fine for local testing.
          NEEDS_APPDMG: "1"

      # ── 9. Upload the DMG as a build artifact ─────────────────────────────
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: helium-pr915-${{ github.event.inputs.arch }}-macos
          # The DMG is written to build/ by sign_and_package_app.sh
          path: helium-macos/build/*.dmg
          if-no-files-found: error
          retention-days: 14