name: Test PR Build

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build Helium for macOS (M1/M2/M3)
    runs-on: macos-latest

    steps:
      - name: Checkout helium-macos repository
        uses: actions/checkout@v4
        with:
          repository: imputnet/helium-macos
          ref: main               # change to a specific branch/tag/PR if needed
          fetch-depth: 0
          submodules: recursive

      - name: Install Xcode command line tools
        run: xcode-select --install || true

      - name: Update Homebrew and upgrade packages
        run: |
          brew update --force --quiet
          brew upgrade --quiet

      - name: Install build dependencies
        run: brew install ninja coreutils python@3.13

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Helium Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install httplib2==0.22.0 requests pillow

      - name: Build Helium
        run: |
          echo "Current working directory: $(pwd)"
          echo "Listing root files:"
          ls -la .

          # Explicitly source env.sh first (it's in the repo root)
          if [ -f "./env.sh" ]; then
            echo "Sourcing env.sh from current directory..."
            source ./env.sh || { echo "Failed to source env.sh"; exit 1; }
          else
            echo "env.sh not found in current directory!"
            exit 1
          fi

          # Now source dev.sh (should now have environment variables loaded)
          echo "Sourcing dev.sh..."
          source ./dev.sh || { echo "Failed to source dev.sh"; exit 1; }

          echo "Running he setup..."
          he setup || { echo "he setup failed - check logs above for missing deps or gclient sync issues"; exit 1; }

          echo "Running he build..."
          he build || { echo "he build failed"; exit 1; }

      - name: Upload build output (if any)
        if: always()  # upload even on failure for debugging
        uses: actions/upload-artifact@v4
        with:
          name: Helium-Build-Output
          path: |
            build/
            out/
          if-no-files-found: warn