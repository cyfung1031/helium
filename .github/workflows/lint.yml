name: Check patch series correctness

on:
    schedule:
        - cron: '30 1 * * *'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13' 
    - run: python3 ./devutils/lint.py
